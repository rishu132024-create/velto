<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="theme-color"
        content="#111111"
    >
    <title>Velto Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Velto</h1>
        <p>Mobile Playground</p>
    </header>

    <main>
        <section class="panel">
            <div class="panel-title">
                <span>Code</span>
                <button id="run">Run ▶</button>
            </div>

            <textarea id="editor">name = "Velto"

if name == "Velto":
    say name

numbers = [10, 20, 30]

for number in numbers:
    say number</textarea>
        </section>

        <section class="panel">
            <div class="panel-title">
                <span>Output</span>
                <button id="clear">Clear</button>
            </div>

            <pre id="output">Output will appear here.</pre>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
