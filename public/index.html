<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velto Playground</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h1>Velto</h1>
        <p>Online Programming Playground</p>
    </header>

    <main>
        <section>
            <h2>Code</h2>

            <textarea id="code">name = "Velto"
say name

numbers = (10, 20, 30)

for number in numbers:
    say number</textarea>

            <button id="run">▶ Run</button>
        </section>

        <section>
            <h2>Output</h2>
            <pre id="output">Click Run to execute your Velto program.</pre>
        </section>
    </main>

    <script src="/script.js"></script>
</body>
</html>
